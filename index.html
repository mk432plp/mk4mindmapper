<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f8fafc" />
    <title>MK4 MindMapper</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app" class="app-shell">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark">M4</span>
          <span>MK4 MindMapper</span>
        </div>
        <nav class="menus" aria-label="Application menu">
          <div class="menu-container">
            <button data-menu="file">File</button>
            <div id="fileMenu" class="dropdown-menu" hidden>
              <button data-action="new">New</button>
              <button data-action="open">Open</button>
              <button data-action="save">Save .mk4map</button>
            </div>
          </div>
          <div class="menu-container">
            <button data-menu="edit">Edit</button>
            <div id="editMenu" class="dropdown-menu" hidden>
              <button data-action="undo">Undo</button>
              <button data-action="redo">Redo</button>
              <button data-action="duplicate">Duplicate</button>
              <button data-action="delete">Delete</button>
            </div>
          </div>
          <div class="menu-container">
            <button data-menu="view">View</button>
            <div id="viewMenu" class="dropdown-menu" hidden>
              <button data-action="fit">Fit to Screen</button>
              <button data-action="theme">Toggle Theme</button>
              <button data-action="focus">Focus Mode</button>
            </div>
          </div>
          <div class="menu-container">
            <button data-menu="insert">Insert</button>
            <div id="insertMenu" class="dropdown-menu" hidden>
              <button data-action="child">Child Topic</button>
              <button data-action="sibling">Sibling Topic</button>
              <button data-action="floating">Floating Topic</button>
              <button data-action="relationship">Relationship</button>
              <button data-action="boundary">Boundary</button>
              <button data-action="summary">Summary</button>
              <button data-action="image">Image</button>
            </div>
          </div>
          <div class="menu-container">
            <button data-menu="export">Export</button>
            <div id="exportMenu" class="dropdown-menu" hidden>
              <button data-action="export-mk4">MK4 Map</button>
              <button data-action="export-xmind">XMind</button>
              <button data-action="export-png">PNG Image</button>
              <button data-action="export-svg">SVG Vector</button>
              <button data-action="export-md">Markdown</button>
              <button data-action="export-json">JSON</button>
            </div>
          </div>
        </nav>
        <div class="top-actions">
          <button id="themeToggle" title="Toggle light/dark mode">
             <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
          </button>
          <button id="presentationBtn" title="Presentation/focus mode">
             <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="23 7 16 12 23 17 23 7"></polygon><rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect></svg>
          </button>
        </div>
      </header>

      <section class="toolbar" aria-label="Mind map toolbar">
        <button id="newBtn">New</button>
        <button id="openBtn">Open</button>
        <button id="saveBtn" class="primary">Save .mk4map</button>
        <span class="separator"></span>
        <button id="addChildBtn">Child</button>
        <button id="addSiblingBtn">Sibling</button>
        <button id="floatingBtn">Floating</button>
        <button id="relationshipBtn">Relationship</button>
        <button id="boundaryBtn">Boundary</button>
        <button id="summaryBtn">Summary</button>
        <span class="separator"></span>
        <button id="undoBtn">Undo</button>
        <button id="redoBtn">Redo</button>
        <label class="search-box">
          <span>Search</span>
          <input id="searchInput" type="search" placeholder="Topic, note, tag" />
        </label>
        <input id="fileInput" type="file" hidden accept=".mk4map,.json,.xmind,.mm,.opml,.md,.txt,.csv,.xml" />
        <input id="imageInput" type="file" hidden accept="image/*" />
      </section>

      <main class="workspace">
        <aside class="panel left-panel" aria-label="Topic Tree">
          <div class="panel-header">
            <h2>Topic Tree</h2>
            <button id="collapseAllBtn" title="Collapse all branches">Collapse</button>
          </div>
          <div id="recoveryBanner" class="recovery-banner" hidden>
            Autosaved work found.
            <button id="recoverBtn">Recover</button>
            <button id="dismissRecoveryBtn">Dismiss</button>
          </div>
          <div id="treePanel" class="tree-panel"></div>
        </aside>

        <section class="canvas-wrap" aria-label="Infinite Canvas">
          <svg id="canvas" class="mind-canvas" role="img" aria-label="Mind map canvas">
            <defs>
              <filter id="nodeShadow" x="-20%" y="-20%" width="140%" height="140%">
                <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#0f172a" flood-opacity="0.12" />
              </filter>
              <marker id="arrowHead" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
                <path d="M0,0 L0,6 L9,3 z" fill="currentColor"></path>
              </marker>
            </defs>
            <g id="mapViewport"></g>
          </svg>
          <div id="inlineEditor" class="inline-editor" hidden>
            <input id="inlineEditorInput" />
          </div>
          <div id="minimap" class="minimap" aria-hidden="true"></div>
        </section>

        <aside class="panel right-panel" aria-label="Properties">
          <div class="panel-header">
            <h2>Properties</h2>
            <button id="attachImageBtn">Image</button>
          </div>
          <div class="inspector">
            <label>Title <input id="titleInput" /></label>
            <label>Notes <textarea id="notesInput" rows="6" placeholder="Markdown notes, links, decisions"></textarea></label>
            <label>Labels <input id="labelsInput" placeholder="comma separated" /></label>
            <label>Tags <input id="tagsInput" placeholder="#planning, #research" /></label>
            <div class="field-row">
              <label>Shape
                <select id="shapeInput">
                  <option>rounded</option>
                  <option>rectangle</option>
                  <option>ellipse</option>
                  <option>diamond</option>
                  <option>capsule</option>
                  <option>hexagon</option>
                  <option>cloud</option>
                </select>
              </label>
              <label>Font <input id="fontSizeInput" type="number" min="10" max="56" /></label>
            </div>
            <div class="field-row">
              <label>Fill <input id="fillInput" type="color" /></label>
              <label>Text <input id="textColorInput" type="color" /></label>
              <label>Line <input id="borderInput" type="color" /></label>
            </div>
            <div class="field-row">
              <button id="boldBtn">Bold</button>
              <button id="italicBtn">Italic</button>
              <button id="collapseBtn">Collapse</button>
            </div>
            <label>Layout
              <select id="layoutInput">
                <option value="right">Right</option>
                <option value="left">Left</option>
                <option value="balanced">Balanced</option>
                <option value="tree">Tree</option>
              </select>
            </label>
          </div>
        </aside>
        <div id="contextMenu" class="context-menu" hidden>
        <button data-action="child">Add Child <span class="shortcut">Tab</span></button>
        <button data-action="sibling">Add Sibling <span class="shortcut">Enter</span></button>
        <div class="menu-divider"></div>
        <button data-action="edit">Edit Text <span class="shortcut">F2</span></button>
        <button data-action="duplicate">Duplicate <span class="shortcut">Ctrl+V</span></button>
        <div class="menu-divider"></div>
        <button data-action="delete" class="danger">Delete <span class="shortcut">Del</span></button>
      </div>
      </main>

      <footer class="statusbar">
        <span id="statusText">Ready</span>
        <span id="selectionText">Root Idea</span>
        <div class="zoom-controls">
          <button id="zoomOutBtn">-</button>
          <input id="zoomRange" type="range" min="5" max="1000" value="100" />
          <button id="zoomInBtn">+</button>
          <button id="fitBtn">Fit</button>
          <span id="zoomText">100%</span>
        </div>
      </footer>
    </div>
    <script type="module" src="src/app.js"></script>
  </body>
</html>
